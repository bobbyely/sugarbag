# Weekly dependency updates: the Python base image in the Dockerfile and the GitHub Actions.
# Sugarbag uses only Python's standard library, so there is no pip to track.
# Minor and patch bumps come grouped, so a quiet week is one review; a major bump comes alone.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
