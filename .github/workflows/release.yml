# On a version tag (v0.1.0), checks the tag matches VERSION in sugarbag.py, runs the checks, then builds the
# image for amd64 and arm64 and pushes it to ghcr.io/<owner>/sugarbag as 0.1.0, 0.1 and latest.
# Uses only the repo's own GITHUB_TOKEN, so there is no secret to set up.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches VERSION
        run: |
          version=$(python3 -c "import re; print(re.search(r'^VERSION = \"(.+)\"', open('sugarbag.py').read(), re.M)[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but VERSION is $version"; exit 1; }

      - run: python3 -B sugarbag_test.py

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
